<header class="crud-barra">
  <h2>Empleados</h2>

  <form class="filtro" (submit)="$event.preventDefault(); buscarPorId()">
    <input
      [(ngModel)]="idFiltro"
      name="idFiltro"
      placeholder="Filtrar por ID"
      autocomplete="off"
    />
    <button type="submit" [disabled]="cargando()">Buscar</button>
    <button type="button" class="secundario" (click)="limpiarFiltro()" [disabled]="cargando()">
      Todos
    </button>
  </form>

  <button type="button" (click)="abrirCrear()">+ Crear</button>
</header>

@if (mensaje()) {
  <p class="mensaje" [class.error]="esError()">{{ mensaje() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Cargo</th>
      <th>Departamento</th>
      <th>Email</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (fila of filas(); track fila.id) {
      <tr>
        <td>{{ fila.nombre }}</td>
        <td>{{ fila.cargo }}</td>
        <td>{{ fila.departamento }}</td>
        <td>{{ fila.email }}</td>
        <td class="acciones">
          <button type="button" (click)="abrirEditar(fila)">Editar</button>
          <button type="button" class="peligro" (click)="eliminar(fila)">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>

@if (popupAbierto()) {
  <div class="fondo-popup" (click)="cerrarPopup()">
    <form class="popup" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ modo() === 'crear' ? 'Crear empleado' : 'Editar empleado' }}</h3>

      <label class="campo">
        <span>Nombre</span>
        <input [(ngModel)]="formulario.nombre" name="nombre" required />
      </label>
      <label class="campo">
        <span>Cargo</span>
        <input [(ngModel)]="formulario.cargo" name="cargo" required />
      </label>
      <label class="campo">
        <span>Departamento</span>
        <input [(ngModel)]="formulario.departamento" name="departamento" required />
      </label>
      <label class="campo">
        <span>Email</span>
        <input [(ngModel)]="formulario.email" name="email" type="email" required />
      </label>

      <div class="popup-acciones">
        <button type="button" class="secundario" (click)="cerrarPopup()">Cancelar</button>
        <button type="submit" [disabled]="cargando()">Guardar</button>
      </div>
    </form>
  </div>
}
